<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Submitted</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body { background:#f4f6fb; font-family:'Poppins', sans-serif; }
    .top-banner{
      background: linear-gradient(90deg,#4361ee,#6b46c1);
      color:#fff; border-radius:24px; padding:28px; text-align:center;
      box-shadow:0 12px 28px rgba(0,0,0,.12);
    }
    .card-wrap{ border-radius:22px; box-shadow:0 10px 26px rgba(0,0,0,.08); }
  </style>
</head>

<body>
<div class="container py-4">

  <div class="top-banner mb-4">
    <h2 class="mb-1"><i class="bi bi-check-circle-fill me-2"></i>Exam Submitted Successfully!</h2>
    <div class="opacity-75">Exam: <b th:text="${exam.examName}">Final Exam</b></div>
  </div>

  <div class="card card-wrap">
    <div class="card-body p-4">

      <h3 class="text-center mb-4">Your Answers</h3>

      <div class="table-responsive">
        <table class="table table-bordered align-middle">
          <thead class="table-light">
          <tr>
            <th style="width:70px;">#</th>
            <th>Question</th>
            <th style="width:180px;">Your Answer</th>
            <th style="width:180px;">Correct Answer</th>
          </tr>
          </thead>

          <tbody>
          <tr th:each="q, stat : ${questions}">
            <td th:text="${stat.count}">1</td>
            <td th:text="${q.questionText}">Question</td>

            <!-- ✅ Your Answer from answers map -->
            <td th:text="${answers[q.id]}">A</td>

            <!-- ✅ Correct Answer -->
            <td>
              <span th:if="${q.type == 'MCQ'}" th:text="${q.correctOption}">A</span>
              <span th:if="${q.type != 'MCQ'}" class="text-muted">—</span>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

      <hr class="my-4">

      <div class="text-center">
        <h3 class="mb-2">
          <span>Score:</span>
          <b th:text="${score}">0</b>
          <span>/</span>
          <b th:text="${totalMarks}">0</b>
        </h3>

        <h3 class="mb-2">
          <span>Status:</span>
          <b th:text="${status}"
             th:classappend="${status=='PASS' ? 'text-success' : (status=='FAIL' ? 'text-danger' : 'text-warning')}">
            PASS
          </b>
        </h3>

        <div class="text-muted">
          <i class="bi bi-info-circle"></i>
          Pass mark is <b th:text="${passMark}">0</b> (75% of total marks).
        </div>

        <a th:href="@{/student/exams}" class="btn btn-primary mt-4 px-4">
          Back to Exam List
        </a>
      </div>

    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
