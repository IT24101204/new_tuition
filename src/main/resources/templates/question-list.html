<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questions</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --sidebar-width: 260px;
      --primary-color: #4361ee;
      --sidebar-bg: #1e2129;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f0f2f5;
      overflow-x: hidden;
    }

    #sidebar {
      width: var(--sidebar-width);
      min-height: 100vh;
      background: var(--sidebar-bg);
    }

    #sidebar .logo {
      color: white;
      font-size: 1.4rem;
      font-weight: bold;
      padding: 20px;
      border-bottom: 1px solid #444;
    }

    #sidebar a {
      color: #ddd;
      padding: 12px 20px;
      display: block;
      text-decoration: none;
    }

    #sidebar a:hover,
    #sidebar .active {
      background: #2a2e3b;
      color: white;
    }

    #content {
      flex: 1;
      padding: 20px;
    }

    .card {
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    table th {
      background: #f8f9fa;
    }
  </style>
</head>

<body>

<div class="d-flex">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="logo">
      <i class="bi bi-mortarboard-fill"></i> Admin
    </div>

    <a th:href="@{/exams/list}">
      <i class="bi bi-calendar-check me-2"></i> Exams
    </a>

    <a class="active" href="#">
      <i class="bi bi-question-circle me-2"></i> Questions
    </a>

    <a th:href="@{/logout}">
      <i class="bi bi-box-arrow-right me-2"></i> Logout
    </a>
  </div>

  <!-- MAIN -->
  <div id="content">

    <!-- NAVBAR -->
    <nav class="navbar navbar-light bg-white shadow-sm mb-4 rounded">
      <div class="container-fluid">
                <span class="navbar-brand fw-bold">
                    Question Management
                </span>
      </div>
    </nav>

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h4 class="fw-bold mb-1">
          <i class="bi bi-question-circle"></i> Questions
        </h4>
        <div class="text-muted">
          Exam:
          <b th:text="${exam != null ? exam.examName : 'N/A'}">Exam Name</b>
          | Subject:
          <b th:text="${exam != null ? exam.subject : 'N/A'}">Subject</b>
          | Batch:
          <b th:text="${exam != null ? exam.batchName : 'N/A'}">Batch</b>
        </div>
      </div>

      <div class="d-flex gap-2">
        <a th:href="@{/exams/list}" class="btn btn-secondary">
          <i class="bi bi-arrow-left"></i> Back to Exams
        </a>

        <a th:href="@{/questions/add/{id}(id=${exam.id})}" class="btn btn-primary">
          <i class="bi bi-plus-circle"></i> Add Question
        </a>
      </div>
    </div>

    <!-- TABLE -->
    <div class="card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
            <tr>
              <th>#</th>
              <th>Type</th>
              <th>Question</th>
              <th>Marks</th>
              <th>MCQ Options</th>
              <th>Correct</th>
              <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:if="${#lists.isEmpty(questions)}">
              <td colspan="7" class="text-center text-muted py-4">
                No questions added yet.
              </td>
            </tr>

            <tr th:each="q, stat : ${questions}">
              <td th:text="${stat.count}">1</td>
              <td>
                <span class="badge bg-info text-dark" th:text="${q.type}">MCQ</span>
              </td>

              <td th:text="${q.questionText}">Question text</td>
              <td th:text="${q.marks}">1</td>

              <td>
                <div th:if="${q.type == 'MCQ'}" class="small">
                  <div><b>A:</b> <span th:text="${q.optionA}"></span></div>
                  <div><b>B:</b> <span th:text="${q.optionB}"></span></div>
                  <div><b>C:</b> <span th:text="${q.optionC}"></span></div>
                  <div><b>D:</b> <span th:text="${q.optionD}"></span></div>
                </div>
                <span th:if="${q.type != 'MCQ'}" class="text-muted">—</span>
              </td>

              <td>
                <span th:text="${q.type == 'MCQ' ? q.correctOption : '—'}"></span>
              </td>

              <td>
                <a class="btn btn-sm btn-warning"
                   th:href="@{/questions/edit/{id}(id=${q.id})}">
                  <i class="bi bi-pencil"></i> Edit
                </a>

                <a class="btn btn-sm btn-danger ms-1"
                   th:href="@{/questions/delete/{id}(id=${q.id})}"
                   onclick="return confirm('Delete this question?')">
                  <i class="bi bi-trash"></i> Delete
                </a>
              </td>


            </tr>

            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
