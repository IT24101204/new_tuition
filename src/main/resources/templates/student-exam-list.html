<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Exams</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --sidebar-width: 260px;
      --primary-color: #4361ee;
      --sidebar-bg: #1e2129;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f0f2f5;
      overflow-x: hidden;
    }

    #sidebar {
      width: var(--sidebar-width);
      min-height: 100vh;
      background: var(--sidebar-bg);
    }

    #sidebar .logo {
      color: white;
      font-size: 1.4rem;
      font-weight: bold;
      padding: 20px;
      border-bottom: 1px solid #444;
    }

    #sidebar a {
      color: #ddd;
      padding: 12px 20px;
      display: block;
      text-decoration: none;
    }

    #sidebar a:hover,
    #sidebar .active {
      background: #2a2e3b;
      color: white;
    }

    #content {
      flex: 1;
      padding: 20px;
    }

    .card {
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 0;
    }

    table th {
      background: #f8f9fa;
      white-space: nowrap;
    }

    .badge-online {
      background: rgba(67, 97, 238, 0.12);
      color: #2f49c6;
      border: 1px solid rgba(67, 97, 238, 0.25);
      font-weight: 600;
    }

    .badge-physical {
      background: rgba(108, 117, 125, 0.15);
      color: #495057;
      border: 1px solid rgba(108, 117, 125, 0.25);
      font-weight: 600;
    }

    .btn-start {
      background: var(--primary-color);
      border: none;
      font-weight: 600;
      border-radius: 10px;
      padding: 8px 14px;
    }

    .btn-start:hover { filter: brightness(0.95); }
  </style>
</head>

<body>

<div class="d-flex">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="logo">
      <i class="bi bi-mortarboard-fill"></i> Student
    </div>

    <a class="active" th:href="@{/student/exams}">
      <i class="bi bi-calendar-check me-2"></i> Exams
    </a>

    <a th:href="@{/logout}">
      <i class="bi bi-box-arrow-right me-2"></i> Logout
    </a>
  </div>

  <!-- MAIN CONTENT -->
  <div id="content">

    <!-- NAVBAR -->
    <nav class="navbar navbar-light bg-white shadow-sm mb-4 rounded">
      <div class="container-fluid">
        <span class="navbar-brand fw-bold">Student Exams</span>
      </div>
    </nav>

    <!-- HEADER -->
    <div class="mb-3">
      <h4 class="fw-bold mb-1">
        <i class="bi bi-list-check"></i> Available Exams
      </h4>
      <div class="text-muted">
        Start button is available only for <b>Online</b> exams.
      </div>
    </div>

    <!-- TABLE -->
    <div class="card">
      <div class="card-body">

        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
              <th>#</th>
              <th>Exam Name</th>
              <th>Subject</th>
              <th>Batch</th>
              <th>Date</th>
              <th>Time</th>
              <th>Location</th>
              <th class="text-end">Action</th>
            </tr>
            </thead>

            <tbody>
            <tr th:if="${#lists.isEmpty(exams)}">
              <td colspan="8" class="text-center text-muted py-4">No exams available.</td>
            </tr>

            <tr th:each="exam, stat : ${exams}">
              <td th:text="${stat.count}">1</td>
              <td class="fw-semibold" th:text="${exam.examName}">Mid Term</td>
              <td th:text="${exam.subject}">Science</td>
              <td th:text="${exam.batchName}">Grade 10</td>

              <!-- ✅ FIXED: use your real fields -->
              <td th:text="${exam.examDate}">2026-02-13</td>
              <td th:text="${exam.examTime}">14:02</td>

              <td>
                <span th:if="${exam.location != null and #strings.equalsIgnoreCase(exam.location, 'Online')}"
                      class="badge badge-online px-3 py-2">
                   Online
                </span>

                <span th:if="${exam.location == null or !#strings.equalsIgnoreCase(exam.location, 'Online')}"
                      class="badge badge-physical px-3 py-2">

                  <span th:text="${exam.location != null ? exam.location : 'Physical'}">Hall A</span>
                </span>
              </td>

              <td class="text-end">
                <!-- Online => Start -->
                <a th:if="${exam.location != null and #strings.equalsIgnoreCase(exam.location, 'Online')}"
                   class="btn btn-start text-white"
                   th:href="@{/student/exams/{id}/start(id=${exam.id})}">
                  <i class="bi bi-play-circle me-1"></i> Start
                </a>

                <!-- Physical => No start -->
                <span th:if="${exam.location == null or !#strings.equalsIgnoreCase(exam.location, 'Online')}"
                      class="badge bg-secondary px-3 py-2">
                  Physical Exam
                </span>
              </td>
            </tr>

            </tbody>
          </table>
        </div>

      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
