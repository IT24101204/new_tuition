<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Question</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --sidebar-width: 260px;
            --primary-color: #4361ee;
            --sidebar-bg: #1e2129;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            overflow-x: hidden;
        }

        #sidebar {
            width: var(--sidebar-width);
            min-height: 100vh;
            background: var(--sidebar-bg);
        }

        #sidebar .logo {
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 20px;
            border-bottom: 1px solid #444;
        }

        #sidebar a {
            color: #ddd;
            padding: 12px 20px;
            display: block;
            text-decoration: none;
        }

        #sidebar a:hover,
        #sidebar .active {
            background: #2a2e3b;
            color: white;
        }

        #content {
            flex: 1;
            padding: 20px;
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
    </style>
</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div id="sidebar">
        <div class="logo">
            <i class="bi bi-mortarboard-fill"></i> Admin
        </div>

        <a th:href="@{/exams/list}">
            <i class="bi bi-calendar-check me-2"></i> Exams
        </a>

        <a class="active" th:href="@{/questions/list/{id}(id=${exam.id})}">
            <i class="bi bi-question-circle me-2"></i> Questions
        </a>

        <a th:href="@{/logout}">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
        </a>
    </div>

    <!-- MAIN -->
    <div id="content">

        <!-- NAVBAR -->
        <nav class="navbar navbar-light bg-white shadow-sm mb-4 rounded">
            <div class="container-fluid">
                <span class="navbar-brand fw-bold">Question Management</span>
            </div>
        </nav>

        <!-- HEADER -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="fw-bold mb-1">
                    <i class="bi bi-plus-circle"></i> Add Question
                </h4>
                <div class="text-muted">
                    Exam:
                    <b th:text="${exam != null ? exam.examName : 'N/A'}">Exam Name</b>
                    | Subject:
                    <b th:text="${exam != null ? exam.subject : 'N/A'}">Subject</b>
                    | Batch:
                    <b th:text="${exam != null ? exam.batchName : 'N/A'}">Batch</b>
                </div>
            </div>

            <a th:href="@{/questions/list/{id}(id=${exam.id})}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Back
            </a>
        </div>

        <!-- FORM CARD -->
        <div class="card">
            <div class="card-body">

                <form th:action="@{/questions/save/{examId}(examId=${exam.id})}"
                      method="post"
                      th:object="${question}">

                    <div class="row g-3">

                        <div class="col-md-3">
                            <label class="form-label">Type</label>
                            <select class="form-select" th:field="*{type}">
                                <option value="MCQ">MCQ</option>
                                <option value="ESSAY">ESSAY</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Marks</label>
                            <input type="number" min="1" class="form-control" th:field="*{marks}">
                        </div>

                        <div class="col-12">
                            <label class="form-label">Question</label>
                            <textarea class="form-control" rows="3" th:field="*{questionText}" required></textarea>
                        </div>

                        <!-- MCQ Fields -->
                        <div class="col-md-6">
                            <label class="form-label">Option A</label>
                            <input type="text" class="form-control" th:field="*{optionA}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Option B</label>
                            <input type="text" class="form-control" th:field="*{optionB}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Option C</label>
                            <input type="text" class="form-control" th:field="*{optionC}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Option D</label>
                            <input type="text" class="form-control" th:field="*{optionD}">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Correct Option (MCQ)</label>
                            <select class="form-select" th:field="*{correctOption}">
                                <option value="">-- Select --</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                            </select>
                        </div>

                    </div>

                    <div class="d-flex justify-content-end mt-4">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check2-circle"></i> Save Question
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
