<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exams</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --sidebar-width: 260px;
            --primary-color: #4361ee;
            --sidebar-bg: #1e2129;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            overflow-x: hidden;
        }

        #sidebar {
            width: var(--sidebar-width);
            min-height: 100vh;
            background: var(--sidebar-bg);
        }

        #sidebar .logo {
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 20px;
            border-bottom: 1px solid #444;
        }

        #sidebar a {
            color: #ddd;
            padding: 12px 20px;
            display: block;
            text-decoration: none;
        }

        #sidebar a:hover,
        #sidebar .active {
            background: #2a2e3b;
            color: white;
        }

        #content {
            flex: 1;
            padding: 20px;
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        table th {
            background: #f8f9fa;
        }

        .badge-online {
            background: #198754;
        }

        .badge-physical {
            background: #6c757d;
        }
    </style>
</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div id="sidebar">
        <div class="logo">
            <i class="bi bi-mortarboard-fill"></i> Admin
        </div>

        <!-- Exams -->
        <a class="active" th:href="@{/exams/list}">
            <i class="bi bi-calendar-check me-2"></i> Exams
        </a>

        <!-- Questions (go to exams list because questions page needs exam id) -->
        <a th:href="@{/exams/list}">
            <i class="bi bi-question-circle me-2"></i> Questions
        </a>

        <a th:href="@{/logout}">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
        </a>
    </div>

    <!-- MAIN -->
    <div id="content">

        <!-- NAVBAR -->
        <nav class="navbar navbar-light bg-white shadow-sm mb-4 rounded">
            <div class="container-fluid">
                <span class="navbar-brand fw-bold">Exam Management</span>
            </div>
        </nav>

        <!-- HEADER -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="fw-bold mb-1">
                    <i class="bi bi-calendar-check"></i> Exams
                </h4>
                <div class="text-muted">Manage online & physical exams here.</div>
            </div>

            <a th:href="@{/exams/add}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Add Exam
            </a>
        </div>

        <!-- TABLE -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Exam Name</th>
                            <th>Subject</th>
                            <th>Batch</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Location</th>
                            <th>Actions</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:if="${#lists.isEmpty(exams)}">
                            <td colspan="8" class="text-center text-muted py-4">
                                No exams added yet.
                            </td>
                        </tr>

                        <tr th:each="exam, stat : ${exams}">
                            <td th:text="${stat.count}">1</td>
                            <td th:text="${exam.examName}">Mid Term</td>
                            <td th:text="${exam.subject}">Science</td>
                            <td th:text="${exam.batchName}">Grade 10</td>

                            <!-- IMPORTANT: use your entity field names here.
                                 If your entity doesn't have "examDate" or "examTime", change to the correct ones.
                            -->
                            <td th:text="${exam.examDate}">2026-02-13</td>
                            <td th:text="${exam.examTime}">14:02</td>

                            <td>
                <span th:if="${exam.location != null and #strings.equalsIgnoreCase(exam.location,'Online')}"
                      class="badge badge-online">Online</span>

                                <span th:if="${exam.location == null or !#strings.equalsIgnoreCase(exam.location,'Online')}"
                                      class="badge badge-physical"
                                      th:text="${exam.location != null ? exam.location : 'Physical'}">
                  Hall A
                </span>
                            </td>

                            <td>
                                <a class="btn btn-sm btn-warning"
                                   th:href="@{/exams/edit/{id}(id=${exam.id})}">
                                    <i class="bi bi-pencil"></i> Edit
                                </a>

                                <a class="btn btn-sm btn-danger ms-1"
                                   th:href="@{/exams/delete/{id}(id=${exam.id})}"
                                   onclick="return confirm('Delete this exam?')">
                                    <i class="bi bi-trash"></i> Delete
                                </a>

                                <!-- ✅ QUESTIONS BUTTON WORKS ONLY FOR ONLINE EXAMS -->
                                <a class="btn btn-sm btn-primary ms-1"
                                   th:if="${exam.location != null and #strings.equalsIgnoreCase(exam.location,'Online')}"
                                   th:href="@{/questions/{id}(id=${exam.id})}">
                                    <i class="bi bi-list-check"></i> Questions
                                </a>


                                <!-- ✅ PHYSICAL EXAM LABEL -->
                                <span class="badge bg-secondary ms-1"
                                      th:if="${exam.location == null or !#strings.equalsIgnoreCase(exam.location,'Online')}">
                  Physical Exam
                </span>
                            </td>
                        </tr>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
