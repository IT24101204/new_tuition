<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Exam</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        :root {
            --sidebar-width: 260px;
            --primary-color: #4361ee;
            --sidebar-bg: #1e2129;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            overflow-x: hidden;
        }

        #sidebar {
            width: var(--sidebar-width);
            min-height: 100vh;
            background: var(--sidebar-bg);
        }

        #sidebar .logo {
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 20px;
            border-bottom: 1px solid #444;
        }

        #sidebar a {
            color: #ddd;
            padding: 12px 20px;
            display: block;
            text-decoration: none;
        }

        #sidebar a:hover {
            background: #2a2e3b;
            color: white;
        }

        #content {
            flex: 1;
            padding: 20px;
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div id="sidebar">

        <div class="logo">
            <i class="bi bi-mortarboard-fill"></i>  Admin
        </div>

        <a th:href="@{/dashboard}">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>

        <a th:href="@{/exam/list}" class="bg-dark text-white">
            <i class="bi bi-calendar-check me-2"></i> Exams
        </a>

        <a th:href="@{/students/list}">
            <i class="bi bi-people me-2"></i> Students
        </a>

        <a th:href="@{/enroll}">
            <i class="bi bi-check2-square me-2"></i> Enroll
        </a>

        <a th:href="@{/logout}">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
        </a>

    </div>


    <!-- MAIN CONTENT -->
    <div id="content">

        <!-- NAVBAR -->
        <nav class="navbar navbar-light bg-white shadow-sm mb-4 rounded">

            <div class="container-fluid">

               <span class="navbar-brand fw-bold">
                    Exam Management
                </span>

                <div class="dropdown">

                    <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i> Admin
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item" th:href="@{/logout}">
                                Logout
                            </a>
                        </li>
                    </ul>

                </div>

            </div>

        </nav>


        <!-- EDIT FORM -->
        <div class="container d-flex justify-content-center">

            <div class="card w-100" style="max-width: 900px;">

                <div class="card-header bg-white fw-bold">
                    <i class="bi bi-pencil-square"></i> Edit Exam
                </div>

                <div class="card-body">


                    <!-- UPDATE FORM -->
                    <form th:action="@{/exams/update}" method="post" th:object="${exam}">



                    <!-- Hidden ID -->
                        <input type="hidden" th:field="*{id}">


                        <div class="row g-3">


                            <!-- Exam Name -->
                            <div class="col-md-6">

                                <label class="form-label">Exam Name</label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{examName}"
                                       required>

                            </div>


                            <!-- Subject -->
                            <div class="col-md-6">

                                <label class="form-label">Subject</label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{subject}"
                                       required>

                            </div>


                            <!-- Grade -->
                            <div class="col-md-4">

                                <label class="form-label">Batch Name</label>

                                <select class="form-select"
                                        th:field="*{batchName}"
                                        required>

                                    <option value="Grade 10">Grade 10</option>
                                    <option value="Grade 11">Grade 11</option>

                                </select>

                            </div>


                            <!-- Date -->
                            <div class="col-md-4">

                                <label class="form-label">Exam Date</label>

                                <input type="date"
                                       class="form-control"
                                       th:field="*{examDate}"
                                       required>

                            </div>


                            <!-- Time -->
                            <div class="col-md-4">

                                <label class="form-label">Exam Time</label>

                                <input type="time"
                                       class="form-control"
                                       th:field="*{examTime}"
                                       required>

                            </div>


                            <!-- Duration -->
                            <div class="col-md-6">

                                <label class="form-label">Duration (Hours)</label>

                                <input type="number"
                                       class="form-control"
                                       th:field="*{duration}"
                                       required>

                            </div>


                            <!-- Location -->
                            <div class="col-md-6">

                                <label class="form-label">Location</label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{location}">

                            </div>


                            <!-- Instructions -->
                            <div class="col-12">

                                <label class="form-label">Instructions</label>

                                <textarea class="form-control"
                                          rows="3"
                                          th:field="*{instructions}">
                                </textarea>

                            </div>


                        </div>


                        <!-- Buttons -->
                        <div class="d-flex justify-content-end mt-4">

                            <a th:href="@{/exams/list}" class="btn btn-secondary me-2">Cancel</a>


                            <button type="submit"
                                    class="btn btn-primary">

                                <i class="bi bi-check-circle"></i> Update Exam

                            </button>

                        </div>


                    </form>


                </div>

            </div>

        </div>


    </div>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
